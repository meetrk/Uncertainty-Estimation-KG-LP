dataset:
  name: WN18RR
  path: ./dataset/wn18rr

model:
  encoder:
    type: RGCN
    hidden_layer_size: 500
    embedding_dim: 500
    dropout: 0.2
    num_bases : 5

  decoder:
    type: DistMult
    l2_penalty : 0.001
    w_gain: false
    b_init: false

ensemble:
  enabled: true
  num_models: 5 

training:
  epochs: 10000
  sampling:
    negative_sampling_ratio: 1
    edge_dropout: 0.2
  optimiser:
    learning_rate: 0.01
    weight_decay: 0
  evaluation_frequency: 100
  early stopping:
    enabled: true
    patience: 10
    delta: 0.001
  load_model: true
  save_model: true
  checkpoint_path: ./saved_models/experiment_2/WN18RR_ensemble_checkpoint_neg_1.pth
  test: true
  label_smoothing: 
    positive: 1
    negative: 0
calibration:
  enabled: false
  type: ensemble
  mc_samples: 5
  method: scalar
  max_iters: 100
  learning_rate: 0.01