dataset:
  name: FB15k-237
  path: ./dataset/fb15k237

model:
  encoder:
    type: RGCN
    hidden_layer_size: 500
    embedding_dim: 500
    dropout: 0.2
    num_bases : 5
    bases_enabled: false

  decoder:
    type: DistMult
    l2_penalty : 0.001
    w_gain: false
    b_init: false
  
ensemble:
  enabled: false
  num_models: 5 

training:
  epochs: 10000
  sampling:
    negative_sampling_ratio: 3
    edge_dropout: 0.2
  optimiser:
    learning_rate: 0.01
    weight_decay: 0
  evaluation_frequency: 500
  early stopping:
    enabled: true
    patience: 5
    delta: 0.001
  load_model: true
  save_model: false
  checkpoint_path: ./new_models/experiment_1/FB15k-237_checkpoint_label_1_negative_sampling_3_edge_dropout_0.2_epoch_1000.pth
  label_smoothing: 
    positive: 0.9
    negative: 0.05
calibration:
  enabled: true
  type: mc_dropout
  mc_samples: 5
  method: platt_scaling
  max_iters: 1000
  learning_rate: 0.01